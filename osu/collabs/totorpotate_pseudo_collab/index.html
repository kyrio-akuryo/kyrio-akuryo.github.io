<!DOCTYPE html>

    <title>French Youtuber Collab 2023</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff66aa;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }

        h1 {
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .collab-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
        }

        .player-card {
            position: relative;
            width: 150px;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid transparent;
        }

        .player-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .player-info {
            padding: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .player-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(255, 102, 170, 0.3);
        }

        .player-card:hover .player-info {
            background: var(--accent-color);
        }
    </style>
</head>
